services:
  - type: web
    name: kirbancials
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
